<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec"><title>StyleOS — Personal Style Intelligence</title>
<style>
:root{--bg:#f5f2ec;--panel:#fffefa;--ink:#22231f;--muted:#85867e;--line:#e8e4dc;--accent:#68745d;--accent2:#dfe5d8;--soft:#f0eee8;--danger:#a34c43;--shadow:0 10px 35px #29271c0b}
[data-theme=dark]{--bg:#171916;--panel:#22251f;--ink:#f0eee7;--muted:#aaa99f;--line:#393c34;--accent:#b5c49f;--accent2:#394333;--soft:#2c3029;--shadow:0 10px 35px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer} .app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:28px;background:var(--panel);position:sticky;top:0;height:100vh}.brand{padding:0 12px}.brand b{font:600 25px Georgia,serif;letter-spacing:2px}.brand small{display:block;color:var(--muted);letter-spacing:2px;font-size:9px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:var(--soft);color:var(--ink)}.nav .ico{width:19px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;padding:10px 12px}.main{min-width:0;padding:34px clamp(18px,4vw,58px) 80px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted);font-weight:700}.h1{font:500 clamp(28px,4vw,43px)/1.12 Georgia,serif;margin:8px 0}.sub{color:var(--muted);margin:8px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:600}.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font:500 29px Georgia,serif;margin-top:9px}.stat small{color:var(--muted)}.cols{grid-template-columns:1.25fr .75fr}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.sectionhead h2{font:500 23px Georgia,serif;margin:0}.muted{color:var(--muted)}.hero{background:var(--accent2);border-radius:18px;padding:26px;display:flex;justify-content:space-between;gap:18px;align-items:center;min-height:190px}.hero h2{font:500 31px Georgia,serif;margin:8px 0}.hero p{color:var(--muted);max-width:430px}.heroart{font-size:75px;opacity:.7}.itemgrid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}.item{padding:0;overflow:hidden}.visual{height:165px;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative}.visual img{width:100%;height:100%;object-fit:cover}.visual .emoji{font-size:65px;filter:grayscale(.15)}.itembody{padding:12px}.itembody b{display:block;font-size:13px}.itembody small{color:var(--muted)}.pill{display:inline-block;background:var(--soft);padding:4px 8px;border-radius:30px;font-size:10px;color:var(--muted);margin:3px 3px 0 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 11px;border-radius:9px;outline:none}.field textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.wide{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:500 22px Georgia,serif;margin-bottom:6px}.outfit{display:flex;gap:12px;flex-wrap:wrap}.outfitpiece{flex:1;min-width:105px;text-align:center;background:var(--soft);border-radius:12px;padding:15px 8px}.outfitpiece .emoji{font-size:38px}.outfitpiece small{display:block;color:var(--muted)}.score{font:500 32px Georgia,serif}.bar{height:7px;background:var(--soft);border-radius:8px;overflow:hidden}.bar span{height:100%;display:block;background:var(--accent)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:600}.modalback{position:fixed;inset:0;background:#10120fcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:var(--panel);border-radius:17px;padding:23px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font:500 25px Georgia,serif;margin:0}.close{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:32px;height:32px}.bottomnav{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:30px;z-index:20;display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:83px;padding:7px;font-size:11px}.day.today{border-color:var(--accent)}.day em{display:block;font-style:normal;color:var(--muted)}.day .daytag{background:var(--accent2);border-radius:5px;padding:3px;margin-top:5px;overflow:hidden}.tagrow{display:flex;flex-wrap:wrap;gap:6px}.tagrow button.selected{background:var(--accent2);border-color:var(--accent)}.recommend{border-left:3px solid var(--accent);padding-left:13px;margin:12px 0}.hidden{display:none!important}#recommendations{scroll-margin-top:12px}.recrow{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;-webkit-overflow-scrolling:touch}.recrow>.card{flex:1 0 250px;max-width:340px;scroll-snap-align:start}.recrow>.empty{flex:1 0 100%;max-width:none}.recrow .lookcanvas{margin:12px auto}.chip.selected{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:24px 16px 90px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottomnav::-webkit-scrollbar{display:none}.bottomnav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:2px;justify-items:center;flex:1 0 76px;white-space:nowrap}.bottomnav button.active{color:var(--ink)}.bottomnav span{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.heroart{font-size:48px}.calendar{gap:3px}.day{min-height:65px;padding:4px;font-size:9px}.daytag{font-size:8px}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}

.visualizer{background:#f4f2ed;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;overflow:hidden}
.visualizer canvas{display:block;width:100%;max-width:760px;height:auto;margin:0 auto;border-radius:8px;background:#fff}
.modebar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.modebar .btn.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.studiogrid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}@media(max-width:850px){.studiogrid{grid-template-columns:1fr}}
.lookcanvas{display:block;width:100%;max-width:560px;height:auto;margin:16px auto;border-radius:14px;background:#fff;border:1px solid var(--line)}
.mannequin-wrap{background:#f4f2ed;border-radius:12px;padding:16px;display:flex;justify-content:center}
.mannequin-wrap svg{width:min(100%,360px);height:auto;max-height:620px}
.visual-caption{font-size:11px;color:#777;margin-top:9px}

/* ===== Finishing touch: refined light + classy glass dark ===== */

.card,.btn,.field input,.field select,.field textarea,.search{transition:background .25s,border-color .25s,box-shadow .25s,transform .25s}
.btn:active{transform:scale(.97)}
@media(hover:hover){.card.item:hover{transform:translateY(-3px);box-shadow:0 18px 40px #29271c1c}.btn:hover{border-color:var(--accent)}}

[data-theme=dark] .card,[data-theme=dark] .side,[data-theme=dark] .bottomnav,[data-theme=dark] .modal,[data-theme=dark] .visualizer{-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}

</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><b>STYLEOS</b><small>PERSONAL STYLE INTELLIGENCE</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Your wardrobe. Your style.<br>All data stays on this device.</div></aside>
<main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL STYLIST</div><h1 class="h1" id="pageTitle">Good morning. What are we wearing?</h1><p class="sub" id="pageSub">Build better outfits from what you already own.</p></div><div class="actions"><button class="btn primary" onclick="openItem()">＋ Add item</button></div></div><div id="view"></div></main>
</div><nav class="bottomnav" id="mobileNav"></nav>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add clothing</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const LKEY='styleos_lists';
const DEF_LISTS={categories:['T-shirts','Shirts','Polos','Jeans','Trousers','Shorts','Joggers','Jackets','Hoodies','Sweaters','Ethnic wear','Formal wear','Shoes','Sneakers','Sandals','Watches','Belts','Bags','Accessories'],occasions:['Casual','College','Formal','Party','Travel','Gym','Wedding','Office'],styles:['Minimalist','Smart casual','Streetwear','Classic','Formal','Sporty','Old money','Casual','Traditional']};
const LISTS=(()=>{let o={};try{o=JSON.parse(localStorage.getItem(LKEY)||'{}')}catch(e){}return{categories:Array.isArray(o.categories)?o.categories:[...DEF_LISTS.categories],occasions:Array.isArray(o.occasions)?o.occasions:[...DEF_LISTS.occasions],styles:Array.isArray(o.styles)?o.styles:[...DEF_LISTS.styles],types:(o.types&&typeof o.types==='object'&&!Array.isArray(o.types))?o.types:{}}})();
const categories=LISTS.categories,OCCASIONS=LISTS.occasions,STYLES=LISTS.styles;
const uniq=a=>[...new Set(a)];
function saveLists(){try{localStorage.setItem(LKEY,JSON.stringify(LISTS))}catch(e){}}
const TYPES=[['top','Upper wear'],['bottom','Lower wear'],['shoe','Footwear'],['accessory','Accessory'],['other','Other']];
function guessType(c){c=(c||'').toLowerCase();if(/shirt|t-shirt|polo|hoodie|jacket|sweater|formal wear|ethnic|kurta|blazer|coat/.test(c))return 'top';if(/trouser|jean|short|jogger|cargo|chino|pant|legging|pyjama|pajama/.test(c))return 'bottom';if(/shoe|sneaker|sandal|boot|loafer|slipper/.test(c))return 'shoe';if(/watch|belt|bag|accessor|cap|glass/.test(c))return 'accessory';return ''}
function catKind(c){return LISTS.types[c]||guessType(c)||'other'}
function drawCatHint(){let s=document.querySelector('select[name=category]'),el=$('catHint');if(!s||!el)return;let c=s.value;if(!c||LISTS.types[c]||guessType(c)){el.innerHTML='';return}el.innerHTML=`<div class="muted" style="font-size:12px;margin-top:6px">Is “${esc(c)}” upper or lower wear? It needs a type to appear in outfits.</div><select class="search" style="margin-top:6px" onchange="setCatType(this.value)"><option value="">Choose type…</option>${TYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select>`}
function setCatType(v){let s=document.querySelector('select[name=category]');if(!v||!s)return;LISTS.types[s.value]=v;saveLists();drawCatHint();toast('Type saved');refresh()}
function tsel(k,n){if(k!=='categories')return '';let cur=n==='new'?'':(LISTS.types[LISTS.categories[n]]||guessType(LISTS.categories[n])||'');return `<select class="search" id="mgr_categories_t${n}" ${n==='new'?'':`onchange="mgrType(${n})"`} style="width:auto;flex:0 0 auto"><option value="">Type…</option>${TYPES.map(t=>`<option value="${t[0]}" ${cur===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select>`}
function mgrType(n){let c=LISTS.categories[n],v=$('mgr_categories_t'+n).value;if(!v)return;LISTS.types[c]=v;saveLists();toast('Type saved');refresh()}
function tagsOf(i,k){let v=i[k+'s'];if(Array.isArray(v))return v;return i[k]?[i[k]]:[]}
function chipGroup(name,opts,sel){opts=uniq([...opts,...sel]);return `<div class="tagrow" data-chips="${name}">${opts.map(x=>`<button type="button" class="btn small chip ${sel.includes(x)?'selected':''}" onclick="this.classList.toggle('selected')">${esc(x)}</button>`).join('')}</div>`}
function readChips(name){return [...document.querySelectorAll(`[data-chips="${name}"] .chip.selected`)].map(b=>b.textContent)}
function catOptions(cur){return uniq([...categories,...(cur?[cur]:[])]).map(c=>`<option ${cur===c?'selected':''}>${esc(c)}</option>`).join('')}
const LFIELD={categories:'category',occasions:'occasion',styles:'style'};
function mgrBtn(k){return `<button type="button" class="btn small ghost" onclick="toggleMgr('${k}')">✎ Manage</button>`}
function toggleMgr(k){let b=$('mgr_'+k);if(b.innerHTML.trim()){b.innerHTML='';return}drawMgr(k)}
function drawMgr(k){let L=LISTS[k],key=`onkeydown="if(event.key==='Enter'){event.preventDefault();this.nextElementSibling.click()}"`;$('mgr_'+k).innerHTML=`<div class="card" style="padding:12px;margin:6px 0 12px">${L.map((x,n)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><input class="search" id="mgr_${k}_${n}" value="${esc(x)}" style="flex:1;width:auto;min-width:0" ${key}>${tsel(k,n)}<button type="button" class="btn small" onclick="mgrRename('${k}',${n})">Save</button><button type="button" class="btn small danger" onclick="mgrDelete('${k}',${n})">Delete</button></div>`).join('')}<div style="display:flex;gap:6px;align-items:center;margin-top:8px"><input class="search" id="mgr_${k}_new" placeholder="Add new…" style="flex:1;width:auto;min-width:0" ${key}>${tsel(k,'new')}<button type="button" class="btn small primary" onclick="mgrAdd('${k}')">Add</button></div></div>`}
function curSel(k){return k==='categories'?[document.querySelector('select[name=category]').value]:readChips(LFIELD[k])}
function refreshField(k,sel){if(k==='categories'){let s=document.querySelector('select[name=category]');s.innerHTML=catOptions(sel[0]||'');drawCatHint();return}let n=LFIELD[k];document.querySelector(`[data-chips="${n}"]`).outerHTML=chipGroup(n,LISTS[k],sel)}
function usedCount(k,x){return items.filter(i=>k==='categories'?i.category===x:tagsOf(i,LFIELD[k]).includes(x)).length}
function mgrAdd(k){let el=$('mgr_'+k+'_new'),v=el.value.trim();if(!v)return;let ty='';if(k==='categories'){ty=$('mgr_categories_tnew').value;if(!ty)return toast('Choose a type: upper, lower, footwear…')}let L=LISTS[k];if(L.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Already in the list');let cur=curSel(k);L.push(v);if(ty)LISTS.types[v]=ty;saveLists();refreshField(k,k==='categories'?[v]:[...cur,v]);drawMgr(k);toast('Added')}
async function mgrRename(k,n){let L=LISTS[k],old=L[n],nv=$('mgr_'+k+'_'+n).value.trim();if(!nv||nv===old)return;if(L.some((x,j)=>j!==n&&x.toLowerCase()===nv.toLowerCase()))return toast('Already in the list');let cur=curSel(k).map(x=>x===old?nv:x);if(k==='categories'){let t=LISTS.types[old]||guessType(old);delete LISTS.types[old];if(t)LISTS.types[nv]=t}L[n]=nv;saveLists();for(let it of items){let ch=false;if(k==='categories'){if(it.category===old){it.category=nv;ch=true}}else{let f=LFIELD[k],a=tagsOf(it,f);if(a.includes(old)){a=a.map(x=>x===old?nv:x);it[f+'s']=a;it[f]=a[0]||'';ch=true}}if(ch)await put('items',it)}if(k==='categories')for(let w of wishlist)if(w.category===old){w.category=nv;await put('wishlist',w)}refreshField(k,cur);drawMgr(k);toast('Renamed everywhere');refresh()}
function mgrDelete(k,n){let L=LISTS[k],x=L[n],u=usedCount(k,x);if(k==='categories'&&L.length<=1)return toast('Keep at least one category');if(!confirm(`Delete "${x}"?`+(u?` ${u} item${u>1?'s use':' uses'} it and will keep it until you edit them.`:'')))return;let cur=curSel(k);L.splice(n,1);if(k==='categories')delete LISTS.types[x];saveLists();refreshField(k,cur);drawMgr(k);toast('Deleted')}

const trimCache=new Map();
function trimmedImage(src){
 if(trimCache.has(src))return trimCache.get(src);
 const p=(async()=>{
  const im=await loadDataImage(src);if(!im)return null;
  const sc=Math.min(1,800/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
  let d;try{d=x.getImageData(0,0,w,h).data}catch(e){return c}
  const px=(X,Y)=>{const k=(Y*w+X)*4;return [d[k],d[k+1],d[k+2],d[k+3]]};
  const op=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)].filter(v=>v[3]>200);
  const bg=op.length>=3?[0,1,2].map(j=>op.reduce((t,v)=>t+v[j],0)/op.length):null;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++){const k=(Y*w+X)*4;
   if(d[k+3]<24)continue;
   if(bg&&Math.abs(d[k]-bg[0])+Math.abs(d[k+1]-bg[1])+Math.abs(d[k+2]-bg[2])<42)continue;
   if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}
  if(x1<0)return c;
  x0=Math.max(0,x0-3);y0=Math.max(0,y0-3);x1=Math.min(w-1,x1+3);y1=Math.min(h-1,y1+3);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
 })();
 trimCache.set(src,p);return p;
}

}
async function composeOutfit(arr,W=800,maxH=1150){

 const main={top:tops[0],bottom:bots[0],shoe:shoes[0]};
 const extra=[...tops.slice(1),...bots.slice(1),...shoes.slice(1),...acc];
 const wid={top:.74,bottom:.56,shoe:.40};
 const get=async(i,t)=>(i.image&&await trimmedImage(i.image))||placeholderTile(i,t);
 const rows=[];
 for(const t of ['top','bottom','shoe']){if(!main[t])continue;const im=await get(main[t],t);const w=W*wid[t];rows.push({im,w,h:w*im.height/im.width})}
 const pad=Math.round(W*.05),ov=Math.round(W*.008),exH=extra.length?Math.round(W*.2):0,exGap=extra.length?Math.round(W*.03):0;
 let stack=rows.reduce((t,r)=>t+r.h,0)-ov*Math.max(0,rows.length-1);
 const k=Math.min(1,(maxH-pad*2-exH-exGap)/Math.max(stack,1));
 rows.forEach(r=>{r.w*=k;r.h*=k});stack*=k;
 const H=Math.round(pad*2+stack+exGap+exH),c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.globalCompositeOperation='multiply';
 let y=pad;
 for(const r of rows){x.drawImage(r.im,(W-r.w)/2,y,r.w,r.h);y+=r.h-ov*k}
 if(extra.length){
  const n=Math.min(extra.length,5),cell=(W-pad*2)/n,ey=pad+stack+exGap;
  for(let n2=0;n2<n;n2++){const im=await get(extra[n2],categoryType(extra[n2])||'other'),s2=Math.min((cell-14)/im.width,exH/im.height),w=im.width*s2,h=im.height*s2;x.drawImage(im,pad+cell*n2+(cell-w)/2,ey+(exH-h)/2,w,h)}
 }
 return c;
}

async function saveOutfit(){let ids=window.selectedItems||[];if(!ids.length)return toast('Select at least one clothing item');let snap=ids.map(id=>items.find(i=>i.id===id)).filter(Boolean).map(i=>({id:i.id,name:i.name,category:i.category,color:i.color,image:i.image}));let o={id:uid(),name:$('outfitName').value.trim()||'Untitled outfit',occasion:$('outfitOccasion').value,style:$('outfitStyle').value,itemIds:ids,snapshot:snap,created:Date.now(),score:scoreOutfit(snap).total};await put('outfits',o);window.selectedItems=[];await refresh();toast('Outfit saved')}
function scoreOutfit(a){let score=60,why=[];let cols=a.map(x=>colorGroup(x.color));let unique=[...new Set(cols)];if(unique.length<=2){score+=12;why.push('A focused colour palette keeps the look cohesive.')}else if(unique.length>4){score-=8;why.push('Several distinct colours may make the look feel busy.')}else why.push('The colour mix has some variety.');let cats=a.map(x=>x.category);if(cats.some(x=>catKind(x)==='top')&&cats.some(x=>catKind(x)==='bottom')){score+=12;why.push('You have both an upper and lower piece.')}else{score-=10;why.push('Consider adding an upper or lower piece for a complete look.')}if(cats.some(x=>catKind(x)==='shoe')){score+=8;why.push('Footwear completes the combination.')}else why.push('Footwear has not been added yet.');return{total:Math.max(0,Math.min(100,score)),why}}
function colorGroup(c=''){c=c.toLowerCase();if(/white|black|grey|gray|beige|cream|navy|brown|tan/.test(c))return'neutral';if(/blue|green|teal/.test(c))return'cool';if(/red|orange|yellow|pink/.test(c))return'warm';return'other'}
function stylist(){setHeader('STYLE INTELLIGENCE','Let StyleOS style you.','Thoughtful combinations, built only from pieces you actually own.');$('view').innerHTML=`<div class="grid cols"><div class="card"><div class="eyebrow">TELL US THE PLAN</div><h2 style="font:500 25px Georgia,serif">What are you dressing for?</h2><div class="formgrid"><div class="field"><label>OCCASION</label><select id="styOcc">${uniq(['Everyday',...OCCASIONS,'Date','Formal meeting']).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>STYLE MOOD</label><select id="styStyle">${['Any style',...STYLES].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>SEASON</label><select id="stySeason">${['Any season','Summer','Winter','Monsoon'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>TEMPERATURE (OPTIONAL °C)</label><input id="styTemp" type="number" placeholder="e.g. 28"></div></div><button class="btn primary" onclick="recommend()">Find my outfits ✧</button></div><div class="card"><div class="eyebrow">HOW IT THINKS</div><h2 style="font:500 24px Georgia,serif">A stylist that knows your closet.</h2><p class="muted">StyleOS uses transparent local rules to check colour harmony, occasion, style, season and outfit completeness. It never invents items you don't own.</p><div class="recommend">Colour harmony</div><div class="recommend">Occasion and style fit</div><div class="recommend">Season suitability</div><div class="recommend">Your wardrobe rotation</div></div></div><div id="recommendations" class="sectionhead"><h2>Recommendations</h2></div><div id="recResults" class="recrow"><div class="card empty"><strong>Your next great outfit is waiting.</strong>Add at least an upper, lower and footwear item for the best suggestions.</div></div>`}
function recommend(){_recommend();setTimeout(()=>{let e=$('recommendations');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},80)}
function _recommend(){let occ=$('styOcc').value,style=$('styStyle').value,season=$('stySeason').value;let upp=items.filter(i=>catKind(i.category)==='top'),low=items.filter(i=>catKind(i.category)==='bottom'),feet=items.filter(i=>catKind(i.category)==='shoe');if(!upp.length||!low.length){$('recResults').innerHTML='<div class="card empty"><strong>We need a few more pieces.</strong>Add at least one upper-wear and one lower-wear item. Footwear will make recommendations more complete.</div>';return}let combos=[];for(let u of upp)for(let l of low)for(let f of (feet.length?feet:[null])){if(u.id===l.id)continue;let arr=[u,l,...(f?[f]:[])];let s=scoreOutfit(arr);let penalty=0;if(style!=='Any style'&&arr.some(i=>tagsOf(i,'style').length&&!tagsOf(i,'style').includes(style)))penalty+=8;if(season!=='Any season'&&arr.some(i=>i.season&&i.season!=='All season'&&i.season!==season))penalty+=12;if(arr.some(i=>{let o=tagsOf(i,'occasion').map(x=>x.toLowerCase());return o.length&&!o.includes(occ.toLowerCase())&&!o.includes('casual')&&!o.includes('everyday')}))penalty+=8;let recent=logs.filter(x=>x.itemIds?.some(id=>arr.some(i=>i.id===id))).length;let score=Math.max(20,s.total-penalty-Math.min(12,recent*2));combos.push({arr,score,why:s.why})}combos.sort((a,b)=>b.score-a.score);let unique=[],seen=new Set();for(let c of combos){let k=c.arr.map(i=>i.id).sort().join('|');if(!seen.has(k)){seen.add(k);unique.push(c)}if(unique.length===4)break}if(!unique.length){$('recResults').innerHTML='<div class="card empty">No suitable combination found yet.</div>';return}$('recResults').innerHTML=unique.map((c,n)=>`<div class="card"><div class="eyebrow">LOOK ${n+1} · ${esc(occ.toUpperCase())}</div><div class="score">${c.score}<small style="font:12px sans-serif;color:var(--muted)"> / 100 heuristic score</small></div><div class="bar"><span style="width:${c.score}%"></span></div><canvas class="lookcanvas" data-ids="${c.arr.map(i=>i.id).join(',')}"></canvas><div class="muted" style="text-align:center;font-size:12px;margin-bottom:12px">${c.arr.map(i=>esc(i.name)).join(' · ')}</div>${c.why.map(x=>`<div class="recommend muted">${esc(x)}</div>`).join('')}<p class="muted">Score is a simple wardrobe heuristic, not an objective fashion rating.</p><button class="btn primary" onclick="saveRecommendation('${c.arr.map(i=>i.id).join(',')}','${esc(occ)}','${esc(style)}')">Save this outfit</button></div>`).join('');drawLooks()}

const STORES=[['myntra','Myntra'],['amazon','Amazon'],['amzn','Amazon'],['flipkart','Flipkart'],['fkrt','Flipkart'],['ajio','Ajio'],['meesho','Meesho'],['nykaa','Nykaa Fashion'],['tatacliq','Tata CLiQ'],['hm.com','H&M'],['zara','Zara'],['uniqlo','Uniqlo'],['snitch','Snitch'],['bewakoof','Bewakoof'],['souledstore','The Souled Store'],['westside','Westside'],['lifestylestores','Lifestyle'],['shoppersstop','Shoppers Stop']];
function cleanUrl(u){u=(u||'').trim();if(u&&!/^https?:\/\//i.test(u)&&/^[\w-]+(\.[\w-]+)+/.test(u))u='https://'+u;try{let x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function storeOf(u){try{let h=new URL(u).hostname.replace(/^www\./,'').toLowerCase(),f=STORES.find(s=>h.includes(s[0]));if(f)return f[1];let p=h.split('.');let n=p.length>=2?p[p.length-2]:p[0];if(/^(co|com|org|net)$/.test(n)&&p.length>=3)n=p[p.length-3];return n.charAt(0).toUpperCase()+n.slice(1)}catch(e){return ''}}
function nameFromUrl(u){try{let segs=new URL(u).pathname.split('/').map(s=>{try{return decodeURIComponent(s)}catch(e){return s}}).filter(s=>/[a-z]/i.test(s)&&!/^(dp|buy|gp|product|p|product-reviews|ref=.*)$/i.test(s));segs.sort((a,b)=>(b.match(/[-_+]/g)||[]).length-(a.match(/[-_+]/g)||[]).length);let s=segs[0]||'';if((s.match(/[-_+]/g)||[]).length<1)return '';s=s.replace(/[-_+]+/g,' ').replace(/\.(html?|php)$/i,'').trim();return s.charAt(0).toUpperCase()+s.slice(1)}catch(e){return ''}}

function openWish(id){let w=wishlist.find(x=>x.id===id)||{},wPhoto=w.image&&String(w.image).startsWith('data:')?w.image:null;$('modalTitle').textContent=id?'Edit wishlist item':'Save from a shop';$('modalBody').innerHTML=`<form id="wishForm"><div class="field"><label>PRODUCT LINK (MYNTRA, AMAZON, ANY SHOP)</label><div style="display:flex;gap:6px"><input name="url" id="wUrl" inputmode="url" placeholder="Paste the link here" value="${esc(w.url||'')}" style="flex:1;min-width:0"><button type="button" class="btn small" id="wPaste">Paste</button></div><small class="muted" id="wStore">${w.url?esc(w.store||storeOf(w.url)):'Optional. Only the shop name is shown, never the long link.'}</small></div><div class="field"><label>PHOTO OF THE CLOTHES</label><input type="file" id="wPhoto" accept="image/*"><small class="muted">Upload a screenshot or saved image. Or paste an image address below. With neither, a letter tile is shown.</small><div id="wPrev">${w.image?'<span class="pill">Image added</span>':''}</div></div><div class="field"><label>IMAGE ADDRESS (OPTIONAL)</label><input name="imgurl" inputmode="url" placeholder="Copy image address on the shop and paste" value="${w.image&&!String(w.image).startsWith('data:')?esc(w.image):''}"></div><div class="field"><label>ITEM NAME *</label><input name="name" id="wName" required value="${esc(w.name||'')}"></div><div class="formgrid"><div class="field"><label>CATEGORY</label><select name="category">${catOptions(w.category||categories[0])}</select></div><div class="field"><label>PRICE (₹)</label><input name="price" type="number" min="0" value="${w.price||''}"></div><div class="field"><label>COLOUR</label><input name="color" value="${esc(w.color||'')}"></div></div><div class="field"><label>NOTES</label><textarea name="reason">${esc(w.reason||'')}</textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`;$('modalback').classList.add('sh function safeConfirm(m){try{let t=Date.now(),r=confirm(m);if(r===false&&Date.now()-t<30)return true;return r}catch(e){return true}}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function restore(file){try{if(!db)throw Error('Browser storage (IndexedDB) is not available here. Open the app from a normal browser/https page.');let txt=(await readFileText(file)).replace(/^\uFEFF/,'');let data=JSON.parse(txt);if(!data||data.version!==1||!Array.isArray(data.items)||!Array.isArray(data.outfits))throw Error('Unsupported or invalid backup');let stores=['items','outfits','logs','wishlist','reviews','calendar'];for(let k of stores){if(data[k]&&!Array.isArray(data[k]))throw Error('Invalid '+k);for(let x of data[k]||[])if(!x||!x.id)throw Error('Record missing ID in '+k)}if(!safeConfirm(`Restore this backup (${data.items.length} items, ${data.outfits.length} outfits)? Existing records with matching IDs will be replaced.`))return;for(let k of stores)for(let x of data[k]||[])await put(k,x);if(data.lists&&typeof data.lists==='object'){for(let k of ['categories','occasions','styles']){let src=data.lists[k];if(!Array.isArray(src))continue;for(let v of src)if(typeof v==='string'&&v.trim()&&!LISTS[k].some(x=>x.toLowerCase()===v.toLowerCase()))LISTS[k].push(v)}if(data.lists.types&&typeof data.lists.types==='object')for(let c in data.lists.types)if(!LISTS.types[c])LISTS.types[c]=data.lists.types[c];saveLists()}if(data.theme==='light'||data.theme==='dark'){document.documentElement.dataset.theme=data.theme;try{localStorage.setItem('styleos_theme',data.theme)}catch(e){}}await refresh();toast(`Restored ${data.items.length} items`)}catch(e){try{alert('Could not restore backup: '+e.message)}catch(_){}toast('Restore failed: '+e.message)}}
function exportCSV(){let rows=[['Name','Category','Colour','Brand','Price INR','Wears','Cost per wear']];items.forEach(i=>rows.push([i.name,i.category,i.color,i.brand,i.price,i.wears,i.wears?Number(i.price||0)/i.wears:'']));let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv'}),'styleos-wardrobe.csv')}
async function resetAll(){if(!confirm('Permanently delete all StyleOS data in this browser? Export a backup first if needed.'))return;for(let s of ['items','outfits','logs','wishlist','reviews','calendar'])for(let x of await all(s))await del(s,x.id);await refresh();toast('Local data deleted')}
async function refresh(){[items,outfits,logs,wishlist,reviews,calendar]=await Promise.all(['items','outfits','logs','wishlist','reviews','calendar'].map(all));render()}
(async()=>{try{db=await openDB();let theme=localStorage.getItem('styleos_theme');if(theme)document.documentElement.dataset.theme=theme;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}await refresh()}catch(e){$('view').innerHTML='<div class="card empty"><strong>Storage could not be opened.</strong>Please open this app in a browser that supports IndexedDB.</div>';console.error(e)}})();
</script></body></html>
