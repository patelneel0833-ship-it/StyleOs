<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec"><title>StyleOS — Personal Style Intelligence</title>
<style>
:root{--bg:#f5f2ec;--panel:#fffefa;--ink:#22231f;--muted:#85867e;--line:#e8e4dc;--accent:#68745d;--accent2:#dfe5d8;--soft:#f0eee8;--danger:#a34c43;--shadow:0 10px 35px #29271c0b}
[data-theme=dark]{--bg:#171916;--panel:#22251f;--ink:#f0eee7;--muted:#aaa99f;--line:#393c34;--accent:#b5c49f;--accent2:#394333;--soft:#2c3029;--shadow:0 10px 35px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer} .app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:28px;background:var(--panel);position:sticky;top:0;height:100vh}.brand{padding:0 12px}.brand b{font:600 25px Georgia,serif;letter-spacing:2px}.brand small{display:block;color:var(--muted);letter-spacing:2px;font-size:9px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:var(--soft);color:var(--ink)}.nav .ico{width:19px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;padding:10px 12px}.main{min-width:0;padding:34px clamp(18px,4vw,58px) 80px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted);font-weight:700}.h1{font:500 clamp(28px,4vw,43px)/1.12 Georgia,serif;margin:8px 0}.sub{color:var(--muted);margin:8px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:600}.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font:500 29px Georgia,serif;margin-top:9px}.stat small{color:var(--muted)}.cols{grid-template-columns:1.25fr .75fr}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.sectionhead h2{font:500 23px Georgia,serif;margin:0}.muted{color:var(--muted)}.hero{background:var(--accent2);border-radius:18px;padding:26px;display:flex;justify-content:space-between;gap:18px;align-items:center;min-height:190px}.hero h2{font:500 31px Georgia,serif;margin:8px 0}.hero p{color:var(--muted);max-width:430px}.heroart{font-size:75px;opacity:.7}.itemgrid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}.item{padding:0;overflow:hidden}.visual{height:165px;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative}.visual img{width:100%;height:100%;object-fit:cover}.visual .emoji{font-size:65px;filter:grayscale(.15)}.itembody{padding:12px}.itembody b{display:block;font-size:13px}.itembody small{color:var(--muted)}.pill{display:inline-block;background:var(--soft);padding:4px 8px;border-radius:30px;font-size:10px;color:var(--muted);margin:3px 3px 0 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 11px;border-radius:9px;outline:none}.field textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.wide{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:500 22px Georgia,serif;margin-bottom:6px}.outfit{display:flex;gap:12px;flex-wrap:wrap}.outfitpiece{flex:1;min-width:105px;text-align:center;background:var(--soft);border-radius:12px;padding:15px 8px}.outfitpiece .emoji{font-size:38px}.outfitpiece small{display:block;color:var(--muted)}.score{font:500 32px Georgia,serif}.bar{height:7px;background:var(--soft);border-radius:8px;overflow:hidden}.bar span{height:100%;display:block;background:var(--accent)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:600}.modalback{position:fixed;inset:0;background:#10120fcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:var(--panel);border-radius:17px;padding:23px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font:500 25px Georgia,serif;margin:0}.close{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:32px;height:32px}.bottomnav{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:30px;z-index:20;display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:83px;padding:7px;font-size:11px}.day.today{border-color:var(--accent)}.day em{display:block;font-style:normal;color:var(--muted)}.day .daytag{background:var(--accent2);border-radius:5px;padding:3px;margin-top:5px;overflow:hidden}.tagrow{display:flex;flex-wrap:wrap;gap:6px}.tagrow button.selected{background:var(--accent2);border-color:var(--accent)}.recommend{border-left:3px solid var(--accent);padding-left:13px;margin:12px 0}.hidden{display:none!important}
@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:24px 16px 90px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottomnav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:2px;justify-items:center}.bottomnav button.active{color:var(--ink)}.bottomnav span{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.heroart{font-size:48px}.calendar{gap:3px}.day{min-height:65px;padding:4px;font-size:9px}.daytag{font-size:8px}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}

.visualizer{background:#f4f2ed;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;overflow:hidden}
.visualizer canvas{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:8px;background:#fff}
.modebar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.modebar .btn.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mannequin-wrap{background:#f4f2ed;border-radius:12px;padding:16px;display:flex;justify-content:center}
.mannequin-wrap svg{width:min(100%,360px);height:auto;max-height:620px}
.visual-caption{font-size:11px;color:#777;margin-top:9px}

</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><b>STYLEOS</b><small>PERSONAL STYLE INTELLIGENCE</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Your wardrobe. Your style.<br>All data stays on this device.</div></aside>
<main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL STYLIST</div><h1 class="h1" id="pageTitle">Good morning. What are we wearing?</h1><p class="sub" id="pageSub">Build better outfits from what you already own.</p></div><div class="actions"><button class="btn" id="themeBtn" title="Toggle theme">◐</button><button class="btn primary" onclick="openItem()">＋ Add item</button></div></div><div id="view"></div></main>
</div><nav class="bottomnav" id="mobileNav"></nav>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add clothing</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const DB='styleos_db_v1';let db,items=[],outfits=[],logs=[],wishlist=[],reviews=[],calendar=[],page='home',editing=null,photoData=null;
const pages=[['home','⌂','Home'],['stylist','✧','Stylist'],['wardrobe','▦','My Wardrobe'],['studio','◇','Outfit Studio'],['calendar','▣','Calendar'],['analytics','▥','Style Analytics'],['shopping','♡','Shopping'],['settings','⚙','Settings']];
const $=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;['items','outfits','logs','wishlist','reviews','calendar'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function del(store,id){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}
function nav(){let html=pages.map(([id,ic,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${n}</button>`).join('');$('nav').innerHTML=html;$('mobileNav').innerHTML=pages.slice(0,5).map(([id,ic,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join('')}
function go(p){page=p;nav();render()}
function setHeader(k,t,s){$('eyebrow').textContent=k;$('pageTitle').textContent=t;$('pageSub').textContent=s}
function itemEmoji(i){let c=i.category||'';return ({'Shirts':'👔','T-shirts':'👕','Polos':'👕','Trousers':'👖','Jeans':'👖','Shorts':'🩳','Shoes':'👞','Sneakers':'👟','Jackets':'🧥','Hoodies':'🧥','Watches':'⌚','Bags':'👜','Accessories':'🕶️','Ethnic wear':'🥻','Formal wear':'🤵'})[c]||'👚'}
function visual(i){return i.image?`<img src="${i.image}" alt="${esc(i.name)}">`:`<div class="emoji" style="color:${esc(i.colorHex||'inherit')}">${itemEmoji(i)}</div>`}
function card(i){return `<div class="card item"><div class="visual">${visual(i)}</div><div class="itembody"><b>${esc(i.name)}</b><small>${esc(i.category)} · ${esc(i.color||'No colour')}</small><div><span class="pill">${i.wears||0} wears</span>${i.favorite?'<span class="pill">♥</span>':''}</div><div class="actions" style="margin-top:9px"><button class="btn small" onclick="editItem('${i.id}')">Edit</button><button class="btn small" onclick="addToOutfit('${i.id}')">＋ Outfit</button></div></div></div>`}
function stats(){let value=items.reduce((s,i)=>s+Number(i.price||0),0),worn=items.filter(i=>i.wears>0).length;return `<div class="grid stats"><div class="card stat"><label>WARDROBE PIECES</label><strong>${items.length}</strong><small>${items.filter(i=>i.favorite).length} favourites</small></div><div class="card stat"><label>SAVED OUTFITS</label><strong>${outfits.length}</strong><small>${logs.length} wears logged</small></div><div class="card stat"><label>WARDROBE VALUE</label><strong>${money(value)}</strong><small>Recorded purchase value</small></div><div class="card stat"><label>NOT YET WORN</label><strong>${items.length-worn}</strong><small>Based on your wear logs</small></div></div>`}
function render(){if(!db)return;nav();switch(page){case'home':home();break;case'wardrobe':wardrobe();break;case'stylist':stylist();break;case'studio':studio();break;case'calendar':calendarPage();break;case'analytics':analytics();break;case'shopping':shopping();break;case'settings':settings();break}}
function home(){setHeader('YOUR PERSONAL STYLIST','Good morning. What are we wearing?','Build better outfits from what you already own.');let today=outfits.find(o=>o.id===calendar.find(c=>c.date===new Date().toISOString().slice(0,10))?.outfitId);$('view').innerHTML=`<div class="hero"><div><div class="eyebrow">A MORE THOUGHTFUL WARDROBE</div><h2>Dress well.<br>Wear what you own.</h2><p>Explore combinations, rediscover forgotten pieces and make every outfit feel intentional.</p><div class="actions"><button class="btn primary" onclick="go('stylist')">Find my outfit ✧</button><button class="btn" onclick="go('wardrobe')">Explore wardrobe</button></div></div><div class="heroart">♧</div></div>${stats()}<div class="grid cols"><div><div class="sectionhead"><h2>Recently added</h2><button class="btn small" onclick="go('wardrobe')">View all</button></div><div class="grid itemgrid">${items.slice().sort((a,b)=>b.created-a.created).slice(0,4).map(card).join('')||`<div class="card empty"><strong>Your wardrobe starts here</strong>Add a few pieces to get styling recommendations.<button class="btn primary" onclick="openItem()">Add your first item</button></div>`}</div></div><div><div class="sectionhead"><h2>Style notes</h2></div><div class="card">${insights().map(x=>`<div class="recommend">${esc(x)}</div>`).join('')||'<p class="muted">Add and wear clothing to unlock personal insights.</p>'}<button class="btn small" onclick="go('analytics')">Explore analytics</button></div><div class="sectionhead"><h2>Quick actions</h2></div><div class="card actions"><button class="btn" onclick="openItem()">＋ Add clothing</button><button class="btn" onclick="go('studio')">◇ Build outfit</button><button class="btn" onclick="go('shopping')">♡ Wishlist</button></div></div></div>`}
function wardrobe(){setHeader('YOUR COLLECTION','My wardrobe','Every piece, in one thoughtfully organized place.');$('view').innerHTML=`<div class="toolbar"><input class="search" id="search" placeholder="Search your wardrobe…" style="max-width:260px" oninput="filterWardrobe()"><select class="search" id="catFilter" style="max-width:180px" onchange="filterWardrobe()"><option value="">All categories</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select><select class="search" id="sortFilter" style="max-width:180px" onchange="filterWardrobe()"><option value="new">Recently added</option><option value="wear">Most worn</option><option value="price">Highest price</option><option value="name">Name</option></select><button class="btn primary" onclick="openItem()">＋ Add clothing</button></div><div class="grid itemgrid" id="itemsGrid">${items.map(card).join('')||'<div class="card empty"><strong>Your digital closet is waiting.</strong>Add clothing with a photograph or use an illustrated placeholder.</div>'}</div>`}
const categories=['T-shirts','Shirts','Polos','Jeans','Trousers','Shorts','Joggers','Jackets','Hoodies','Sweaters','Ethnic wear','Formal wear','Shoes','Sneakers','Sandals','Watches','Belts','Bags','Accessories'];
function filterWardrobe(){let q=$('search').value.toLowerCase(),cat=$('catFilter').value,sort=$('sortFilter').value,a=items.filter(i=>(!cat||i.category===cat)&&[i.name,i.brand,i.color,i.category].join(' ').toLowerCase().includes(q));a.sort((x,y)=>sort==='wear'?(y.wears||0)-(x.wears||0):sort==='price'?Number(y.price)-Number(x.price):sort==='name'?x.name.localeCompare(y.name):y.created-x.created);$('itemsGrid').innerHTML=a.map(card).join('')||'<div class="empty">No matching clothing found.</div>'}
function openItem(id){editing=id||null;let i=items.find(x=>x.id===id)||{};photoData=i.image||null;$('modalTitle').textContent=id?'Edit clothing':'Add clothing';$('modalBody').innerHTML=`<form id="itemForm"><div class="formgrid"><div class="field"><label>ITEM NAME *</label><input name="name" required value="${esc(i.name||'')}" placeholder="e.g. White Oxford shirt"></div><div class="field"><label>CATEGORY *</label><select name="category" required>${categories.map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>PRIMARY COLOUR</label><input name="color" value="${esc(i.color||'')}" placeholder="Navy blue"></div><div class="field"><label>BRAND</label><input name="brand" value="${esc(i.brand||'')}"></div><div class="field"><label>PURCHASE PRICE (₹)</label><input name="price" type="number" min="0" step="1" value="${i.price||''}"></div><div class="field"><label>PURCHASE DATE</label><input name="date" type="date" value="${i.date||''}"></div><div class="field"><label>OCCASION</label><select name="occasion"><option value="">Any</option>${['Casual','College','Formal','Party','Travel','Gym','Wedding','Office'].map(x=>`<option ${i.occasion===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>STYLE</label><select name="style"><option value="">Choose style</option>${['Minimalist','Smart casual','Streetwear','Classic','Formal','Sporty','Old money','Casual','Traditional'].map(x=>`<option ${i.style===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>SEASON</label><select name="season"><option value="">All seasons</option>${['Summer','Winter','Monsoon','All season'].map(x=>`<option ${i.season===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>FIT</label><select name="fit"><option value="">Not specified</option>${['Slim','Regular','Relaxed','Oversized'].map(x=>`<option ${i.fit===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field wide"><label>PHOTOGRAPH (OPTIONAL)</label><input type="file" id="photo" accept="image/*"><small class="muted">Or leave empty to use the built-in illustration. Images are resized and stored on this device.</small><div id="photoPreview">${photoData?'<span class="pill">Existing photograph selected</span>':''}</div></div><div class="field wide"><label>NOTES</label><textarea name="notes">${esc(i.notes||'')}</textarea></div><label class="wide"><input type="checkbox" name="favorite" ${i.favorite?'checked':''}> Save as favourite</label></div><div class="actions" style="justify-content:space-between;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><div class="actions">${id?`<button type="button" class="btn danger" onclick="removeItem('${id}')">Delete</button>`:''}<button class="btn primary">Save item</button></div></div></form>`;$('modalback').classList.add('show');$('photo').onchange=async e=>{let f=e.target.files[0];if(f){photoData=await compressImage(f);$('photoPreview').innerHTML='<span class="pill">Photograph ready</span>'}};$('itemForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),obj={...i,id:i.id||uid(),name:f.get('name').trim(),category:f.get('category'),color:f.get('color'),brand:f.get('brand'),price:Number(f.get('price')||0),date:f.get('date'),occasion:f.get('occasion'),style:f.get('style'),season:f.get('season'),fit:f.get('fit'),notes:f.get('notes'),favorite:f.has('favorite'),image:photoData,wears:i.wears||0,created:i.created||Date.now()};await put('items',obj);await refresh();closeModal();toast('Clothing saved');}}
async function compressImage(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function closeModal(){$('modalback').classList.remove('show');editing=null;photoData=null}
async function editItem(id){openItem(id)}
async function removeItem(id){if(!confirm('Delete this clothing item? Existing outfit history will retain its saved item details.'))return;await del('items',id);await refresh();closeModal();toast('Item deleted')}
function addToOutfit(id){go('studio');setTimeout(()=>{let s=$('pick_'+id);if(s)s.checked=true},0)}
let studioMode='flat';
function studio(){
 setHeader('CREATE SOMETHING NEW','Outfit Studio','Build a complete look, then preview it as a flat-lay or an illustrated mannequin.');
 let chosen=window.selectedItems||[];
 $('view').innerHTML=`<div class="grid cols">
 <div class="card"><div class="sectionhead" style="margin-top:0"><h2>Build your outfit</h2><span class="pill">${chosen.length} selected</span></div>
 <div class="grid itemgrid">${items.map(i=>`<label class="card item"><div class="visual">${visual(i)}</div><div class="itembody"><input type="checkbox" id="pick_${i.id}" ${chosen.includes(i.id)?'checked':''} onchange="togglePick('${i.id}',this.checked)"> <b>${esc(i.name)}</b><small>${esc(i.category)} · ${esc(i.color||'')}</small></div></label>`).join('')||'<div class="empty">Add clothing to start creating outfits.</div>'}</div></div>
 <div class="card"><div class="eyebrow">YOUR COMPLETE LOOK</div><h2 style="font:500 25px Georgia,serif">Outfit visualizer</h2>
 <div class="modebar"><button class="btn small ${studioMode==='flat'?'active':''}" onclick="switchStudioMode('flat')">▤ Flat-lay</button><button class="btn small ${studioMode==='model'?'active':''}" onclick="switchStudioMode('model')">♙ Mannequin</button></div>
 <div id="visualizer" class="visualizer"></div>
 <div class="visual-caption" id="visualCaption"></div>
 <div class="actions" style="margin-top:12px"><button class="btn" onclick="downloadOutfitPreview()">↓ Download image</button><button class="btn" onclick="window.selectedItems=[];studio()">Clear selection</button></div>
 <div class="field" style="margin-top:20px"><label>OUTFIT NAME</label><input id="outfitName" placeholder="e.g. Easy Sunday"></div>
 <div class="field"><label>OCCASION</label><select id="outfitOccasion">${['Everyday','College','Casual','Formal','Party','Date','Travel','Office','Wedding'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="field"><label>STYLE</label><select id="outfitStyle">${['Casual','Minimalist','Smart casual','Streetwear','Classic','Formal','Sporty','Old money'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <button class="btn primary" onclick="saveOutfit()">Save outfit</button></div></div>
 <div class="sectionhead"><h2>Saved outfits</h2></div><div class="grid itemgrid">${outfits.map(o=>outfitCard(o)).join('')||'<div class="card empty">Your saved combinations will appear here.</div>'}</div>`;
 renderStudioVisual();
}
function switchStudioMode(mode){studioMode=mode;studio();}

function selectedClothes(){
 return (window.selectedItems||[]).map(id=>items.find(i=>i.id===id)).filter(Boolean);
}
function categoryType(i){
 const c=(i.category||'').toLowerCase();
 if(/shirt|t-shirt|polo|hoodie|jacket|sweater|formal wear|ethnic/.test(c))return 'top';
 if(/trouser|jean|short|jogger/.test(c))return 'bottom';
 if(/shoe|sneaker|sandal/.test(c))return 'shoe';
 if(/watch|belt|bag|accessor/.test(c))return 'accessory';
 return 'other';
}
function renderStudioVisual(){
 const box=$('visualizer');if(!box)return;
 const chosen=selectedClothes();
 if(!chosen.length){box.innerHTML='<div class="empty"><strong>Your outfit canvas is empty.</strong>Select a shirt, trousers, footwear or accessories to begin.</div>';return;}
 if(studioMode==='flat'){
   box.innerHTML='<canvas id="outfitCanvas" width="720" height="1040"></canvas>';
   $('visualCaption').textContent='Flat-lay composition · Your actual clothing photos are used when available.';
   drawFlatlay(chosen);
 }else{
   box.innerHTML=buildMannequin(chosen);
   $('visualCaption').textContent='Illustrative mannequin preview · colours and clothing categories are represented locally; this is not a photorealistic try-on.';
 }
}
function canvasText(ctx,text,x,y,size,color='#555',weight='normal'){
 ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial`;ctx.fillText(text,x,y);
}
function loadDataImage(src){
 return new Promise(resolve=>{if(!src)return resolve(null);let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=src;});
}
async function drawFlatlay(arr){
 const canvas=$('outfitCanvas');if(!canvas)return;
 const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
 ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
 canvasText(ctx,'STYLEOS',42,55,17,'#252620','bold');
 canvasText(ctx,'YOUR OUTFIT',42,82,11,'#85867e','bold');
 let groups=[['TOP',arr.filter(i=>categoryType(i)==='top')],['BOTTOM',arr.filter(i=>categoryType(i)==='bottom')],['FOOTWEAR',arr.filter(i=>categoryType(i)==='shoe')],['ACCESSORIES',arr.filter(i=>categoryType(i)==='accessory'||categoryType(i)==='other')]];
 let y=112;
 for(const [label,group] of groups){
  if(!group.length)continue;
  canvasText(ctx,label,42,y+17,12,'#777','bold');
  y+=30;
  const gap=14,cardW=(W-84-gap*Math.max(0,Math.min(group.length,2)-1))/Math.min(group.length,2),cardH=group.length>2?170:190;
  for(let idx=0;idx<group.length;idx++){
   let i=group[idx],col=idx%2,row=Math.floor(idx/2),x=42+col*(cardW+gap),yy=y+row*(cardH+14);
   ctx.fillStyle='#f7f6f2';ctx.fillRect(x,yy,cardW,cardH);
   let im=await loadDataImage(i.image);
   if(im){
    let scale=Math.min((cardW-18)/im.width,(cardH-45)/im.height),dw=im.width*scale,dh=im.height*scale;
    ctx.drawImage(im,x+(cardW-dw)/2,yy+7+(cardH-45-dh)/2,dw,dh);
   }else{
    canvasText(ctx,itemEmoji(i),x+cardW/2-25,yy+100,46,'#555');
    canvasText(ctx,(i.color||'').slice(0,24),x+12,yy+130,12,'#777');
   }
   canvasText(ctx,i.name.slice(0,28),x+10,yy+cardH-13,12,'#333','bold');
  }
  y+=Math.ceil(group.length/2)*(cardH+14)+8;
 }
 ctx.strokeStyle='#e8e4dc';ctx.beginPath();ctx.moveTo(42,H-65);ctx.lineTo(W-42,H-65);ctx.stroke();
 canvasText(ctx,'Styled with your own wardrobe',42,H-37,12,'#777');
}
function colorForItem(i){
 const c=(i.color||'').toLowerCase();
 const map={'black':'#292a2d','charcoal black':'#34363a','charcoal':'#45464a','navy':'#25364d','navy blue':'#25364d','sage green':'#899681','green':'#58745d','olive':'#68704b','white':'#eeeDE7','cream':'#e8dfcc','beige':'#c8b99f','grey':'#858585','gray':'#858585','blue':'#6688aa','light blue':'#a8c1d2','brown':'#76583f','red':'#a94f4a','pink':'#d5a3ad'};
 if(map[c])return map[c];
 if(/^#[0-9a-f]{6}$/i.test(i.color||''))return i.color;
 return '#9a9a91';
}
function buildMannequin(arr){
 const top=arr.find(i=>categoryType(i)==='top'),bottom=arr.find(i=>categoryType(i)==='bottom'),shoe=arr.find(i=>categoryType(i)==='shoe');
 const tc=top?colorForItem(top):'#d9d6cc',bc=bottom?colorForItem(bottom):'#44464a',sc=shoe?colorForItem(shoe):'#303030';
 const shirt=top?`<path d="M116 178 L150 145 L185 145 L220 178 L253 195 L235 274 L220 265 L220 390 L116 390 L116 265 L101 274 L83 195 Z" fill="${tc}" stroke="#555" stroke-width="2"/><path d="M150 145 L168 175 L185 145 L178 205 L160 205 Z" fill="#f3f0e8" stroke="#666" stroke-width="1"/><path d="M168 205 L168 390" stroke="#555" stroke-width="2"/>`:'';
 const pants=bottom?`<path d="M116 390 L220 390 L215 625 L178 625 L168 465 L158 625 L121 625 Z" fill="${bc}" stroke="#555" stroke-width="2"/><path d="M168 400 L168 465" stroke="#777" stroke-width="2"/>`:'';
 const shoes=shoe?`<path d="M121 625 L158 625 L156 651 L103 651 Q96 640 121 625Z M178 625 L215 625 L236 651 L181 651Z" fill="${sc}" stroke="#444" stroke-width="2"/>`:'';
 return `<div class="mannequin-wrap"><svg viewBox="0 0 340 730" role="img" aria-label="Illustrated mannequin wearing selected wardrobe colours"><ellipse cx="168" cy="695" rx="115" ry="13" fill="#d8d5cd"/><circle cx="168" cy="92" r="43" fill="#d8b99d" stroke="#9c806c" stroke-width="2"/><path d="M126 86 Q127 39 168 42 Q209 39 210 86 Q194 63 168 64 Q143 64 126 86" fill="#45413c"/><rect x="151" y="130" width="34" height="24" rx="8" fill="#d8b99d"/>${shirt}<path d="M116 180 L83 196 L48 340 Q45 355 60 359 L76 352 L132 225 M220 180 L253 196 L288 340 Q291 355 276 359 L260 352 L204 225" fill="none" stroke="#d8b99d" stroke-width="23" stroke-linecap="round"/>${pants}<path d="M141 625 L140 675 M195 625 L196 675" stroke="#d8b99d" stroke-width="20" stroke-linecap="round"/>${shoes}<text x="168" y="714" text-anchor="middle" font-size="10" fill="#777">STYLEOS · ILLUSTRATIVE PREVIEW</text></svg></div>`;
}

function outfitCard(o){return `<div class="card"><b>${esc(o.name)}</b><p class="muted">${esc(o.occasion)} · ${esc(o.style)}</p><div class="outfit">${(o.snapshot||[]).slice(0,4).map(i=>`<div class="outfitpiece">${i.image?`<img src="${i.image}" style="width:42px;height:42px;object-fit:cover;border-radius:7px">`:itemEmoji(i)}<small>${esc(i.name)}</small></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn small" onclick="wearOutfit('${o.id}')">Mark worn</button><button class="btn small" onclick="rateOutfit('${o.id}')">Rate</button><button class="btn small danger" onclick="deleteOutfit('${o.id}')">Delete</button></div></div>`}
async function saveOutfit(){let ids=window.selectedItems||[];if(!ids.length)return toast('Select at least one clothing item');let snap=ids.map(id=>items.find(i=>i.id===id)).filter(Boolean).map(i=>({id:i.id,name:i.name,category:i.category,color:i.color,image:i.image}));let o={id:uid(),name:$('outfitName').value.trim()||'Untitled outfit',occasion:$('outfitOccasion').value,style:$('outfitStyle').value,itemIds:ids,snapshot:snap,created:Date.now(),score:scoreOutfit(snap).total};await put('outfits',o);window.selectedItems=[];await refresh();toast('Outfit saved')}
function scoreOutfit(a){let score=60,why=[];let cols=a.map(x=>colorGroup(x.color));let unique=[...new Set(cols)];if(unique.length<=2){score+=12;why.push('A focused colour palette keeps the look cohesive.')}else if(unique.length>4){score-=8;why.push('Several distinct colours may make the look feel busy.')}else why.push('The colour mix has some variety.');let cats=a.map(x=>x.category);if(cats.some(x=>/shirt|t-shirt|polo|hoodie|jacket|sweater/i.test(x))&&cats.some(x=>/trouser|jean|short|jogger/i.test(x))){score+=12;why.push('You have both an upper and lower piece.')}else{score-=10;why.push('Consider adding an upper or lower piece for a complete look.')}if(cats.some(x=>/shoe|sneaker|sandal/i.test(x))){score+=8;why.push('Footwear completes the combination.')}else why.push('Footwear has not been added yet.');return{total:Math.max(0,Math.min(100,score)),why}}
function colorGroup(c=''){c=c.toLowerCase();if(/white|black|grey|gray|beige|cream|navy|brown|tan/.test(c))return'neutral';if(/blue|green|teal/.test(c))return'cool';if(/red|orange|yellow|pink/.test(c))return'warm';return'other'}
function stylist(){setHeader('STYLE INTELLIGENCE','Let StyleOS style you.','Thoughtful combinations, built only from pieces you actually own.');$('view').innerHTML=`<div class="grid cols"><div class="card"><div class="eyebrow">TELL US THE PLAN</div><h2 style="font:500 25px Georgia,serif">What are you dressing for?</h2><div class="formgrid"><div class="field"><label>OCCASION</label><select id="styOcc">${['Everyday','College','Casual','Date','Party','Wedding','Formal meeting','Office','Travel','Gym'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>STYLE MOOD</label><select id="styStyle">${['Any style','Minimalist','Smart casual','Streetwear','Classic','Formal','Sporty','Old money','Casual','Traditional'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>SEASON</label><select id="stySeason">${['Any season','Summer','Winter','Monsoon'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>TEMPERATURE (OPTIONAL °C)</label><input id="styTemp" type="number" placeholder="e.g. 28"></div></div><button class="btn primary" onclick="recommend()">Find my outfits ✧</button></div><div class="card"><div class="eyebrow">HOW IT THINKS</div><h2 style="font:500 24px Georgia,serif">A stylist that knows your closet.</h2><p class="muted">StyleOS uses transparent local rules to check colour harmony, occasion, style, season and outfit completeness. It never invents items you don't own.</p><div class="recommend">Colour harmony</div><div class="recommend">Occasion and style fit</div><div class="recommend">Season suitability</div><div class="recommend">Your wardrobe rotation</div></div></div><div id="recommendations" class="sectionhead"><h2>Recommendations</h2></div><div id="recResults" class="grid cols"><div class="card empty"><strong>Your next great outfit is waiting.</strong>Add at least an upper, lower and footwear item for the best suggestions.</div></div>`}
function recommend(){let occ=$('styOcc').value,style=$('styStyle').value,season=$('stySeason').value;let upp=items.filter(i=>/shirt|t-shirt|polo|hoodie|jacket|sweater|formal wear|ethnic/i.test(i.category)),low=items.filter(i=>/trouser|jean|short|jogger/i.test(i.category)),feet=items.filter(i=>/shoe|sneaker|sandal/i.test(i.category));if(!upp.length||!low.length){$('recResults').innerHTML='<div class="card empty"><strong>We need a few more pieces.</strong>Add at least one upper-wear and one lower-wear item. Footwear will make recommendations more complete.</div>';return}let combos=[];for(let u of upp)for(let l of low)for(let f of (feet.length?feet:[null])){if(u.id===l.id)continue;let arr=[u,l,...(f?[f]:[])];let s=scoreOutfit(arr);let penalty=0;if(style!=='Any style'&&arr.some(i=>i.style&&i.style!==style))penalty+=8;if(season!=='Any season'&&arr.some(i=>i.season&&i.season!=='All season'&&i.season!==season))penalty+=12;if(arr.some(i=>i.occasion&&i.occasion.toLowerCase()!==occ.toLowerCase()&&!['casual','everyday'].includes(i.occasion.toLowerCase())))penalty+=8;let recent=logs.filter(x=>x.itemIds?.some(id=>arr.some(i=>i.id===id))).length;let score=Math.max(20,s.total-penalty-Math.min(12,recent*2));combos.push({arr,score,why:s.why})}combos.sort((a,b)=>b.score-a.score);let unique=[],seen=new Set();for(let c of combos){let k=c.arr.map(i=>i.id).sort().join('|');if(!seen.has(k)){seen.add(k);unique.push(c)}if(unique.length===4)break}if(!unique.length){$('recResults').innerHTML='<div class="card empty">No suitable combination found yet.</div>';return}$('recResults').innerHTML=unique.map((c,n)=>`<div class="card"><div class="eyebrow">LOOK ${n+1} · ${esc(occ.toUpperCase())}</div><div class="score">${c.score}<small style="font:12px sans-serif;color:var(--muted)"> / 100 heuristic score</small></div><div class="bar"><span style="width:${c.score}%"></span></div><div class="outfit" style="margin:16px 0">${c.arr.map(i=>`<div class="outfitpiece">${visual(i)}<small>${esc(i.name)}</small></div>`).join('')}</div>${c.why.map(x=>`<div class="recommend muted">${esc(x)}</div>`).join('')}<p class="muted">Score is a simple wardrobe heuristic, not an objective fashion rating.</p><button class="btn primary" onclick="saveRecommendation('${c.arr.map(i=>i.id).join(',')}','${esc(occ)}','${esc(style)}')">Save this outfit</button></div>`).join('')}
async function saveRecommendation(ids,occ,style){let arr=ids.split(',').map(id=>items.find(i=>i.id===id)).filter(Boolean),snap=arr.map(i=>({id:i.id,name:i.name,category:i.category,color:i.color,image:i.image}));await put('outfits',{id:uid(),name:occ+' look',occasion:occ,style,snapshot:snap,itemIds:arr.map(i=>i.id),created:Date.now(),score:scoreOutfit(arr).total});await refresh();toast('Recommendation saved')}
async function wearOutfit(id){let o=outfits.find(x=>x.id===id);if(!o)return;let log={id:uid(),outfitId:id,itemIds:o.itemIds||[],snapshot:o.snapshot,date:new Date().toISOString().slice(0,10),created:Date.now()};await put('logs',log);for(let iid of o.itemIds||[]){let it=items.find(x=>x.id===iid);if(it){it.wears=(it.wears||0)+1;it.lastWorn=log.date;await put('items',it)}}await refresh();toast('Wear logged — looking good')}

function calendarPage(){setHeader('PLAN YOUR LOOKS','Outfit calendar','Give upcoming days a little style planning.');let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="eyebrow">${x}</div>`).join('');for(let x=0;x<first;x++)html+='<div></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,c=calendar.find(x=>x.date===date),o=outfits.find(x=>x.id===c?.outfitId);html+=`<div class="day ${date===new Date().toISOString().slice(0,10)?'today':''}"><em>${d}</em>${o?`<div class="daytag">${esc(o.name)}</div>`:`<button class="btn small" style="padding:2px 5px;margin-top:7px" onclick="planDate('${date}')">＋</button>`}</div>`}$('view').innerHTML=`<div class="card"><div class="sectionhead" style="margin-top:0"><h2>${now.toLocaleString('en',{month:'long'})} ${y}</h2><span class="pill">${calendar.length} planned days</span></div><div class="calendar">${html}</div></div><div class="sectionhead"><h2>Upcoming outfits</h2></div><div class="grid itemgrid">${calendar.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>{let o=outfits.find(x=>x.id===c.outfitId);return o?`<div class="card"><b>${esc(c.date)}</b><p>${esc(o.name)}</p><button class="btn small" onclick="planDate('${c.date}')">Change</button></div>`:''}).join('')||'<div class="card empty">No outfits planned yet.</div>'}</div>`}
async function planDate(date){if(!outfits.length)return toast('Save an outfit in Outfit Studio first');let choices=outfits.map((o,i)=>`${i+1}. ${o.name}`).join('\n'),n=prompt('Choose an outfit number for '+date+':\n'+choices);if(n===null)return;let o=outfits[Number(n)-1];if(!o)return toast('Invalid selection');let old=calendar.find(c=>c.date===date);await put('calendar',{id:old?.id||uid(),date,outfitId:o.id});await refresh();toast('Outfit planned')}
function insights(){let out=[];let old=items.filter(i=>i.wears===0);if(old.length)out.push(`${old.length} item${old.length>1?'s have':' has'} not been logged as worn yet.`);let top=items.slice().sort((a,b)=>(b.wears||0)-(a.wears||0))[0];if(top?.wears)out.push(`${top.name} is your most-worn piece (${top.wears} recorded wears).`);let col={};items.forEach(i=>{if(i.color)col[i.color]=(col[i.color]||0)+1});let common=Object.entries(col).sort((a,b)=>b[1]-a[1])[0];if(common)out.push(`${common[0]} is your most common wardrobe colour.`);if(outfits.length)out.push(`You've saved ${outfits.length} outfit combination${outfits.length===1?'':'s'} to revisit.`);return out}
function analytics(){setHeader('YOUR WARDROBE, DECODED','Style analytics','Understand what you wear, what works and what you already have.');let value=items.reduce((s,i)=>s+Number(i.price||0),0),wears=items.reduce((s,i)=>s+(i.wears||0),0),cats={};items.forEach(i=>cats[i.category]=(cats[i.category]||0)+1);let max=Math.max(1,...Object.values(cats));$('view').innerHTML=`${stats()}<div class="grid cols"><div class="card"><h2 style="font:500 23px Georgia,serif">Wardrobe composition</h2>${Object.entries(cats).map(([k,v])=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span class="muted">${v}</span></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join('')||'<p class="muted">Add clothing to see category insights.</p>'}</div><div class="card"><h2 style="font:500 23px Georgia,serif">Wardrobe efficiency</h2><p class="muted">Recorded wears across your collection</p><div class="score">${wears}</div><p class="muted">Total logged item-wears</p><div class="divider"></div><p>Average purchase value</p><strong>${items.length?money(value/items.length):'—'}</strong><p class="muted">Across ${items.length} items with recorded prices.</p><p>Average cost per wear</p><strong>${wears?money(value/wears):'—'}</strong><p class="muted">Approximate: total purchase value divided by logged item-wears.</p></div></div><div class="sectionhead"><h2>Items to rediscover</h2></div><div class="grid itemgrid">${items.filter(i=>!i.wears).slice(0,8).map(card).join('')||'<div class="card empty">No never-worn items. Keep logging your outfits to improve these insights.</div>'}</div><div class="sectionhead"><h2>Style observations</h2></div><div class="card">${insights().map(x=>`<div class="recommend">${esc(x)}</div>`).join('')||'Add wardrobe items and log wears to generate insights.'}</div>`}
function shopping(){setHeader('BUY WITH INTENTION','Shopping planner','Find wardrobe gaps before adding something new.');$('view').innerHTML=`<div class="card"><div class="sectionhead" style="margin-top:0"><h2>Wishlist</h2><button class="btn primary" onclick="openWish()">＋ Add wishlist item</button></div><p class="muted">Check whether a purchase adds useful combinations to your existing wardrobe.</p></div><div class="grid itemgrid" style="margin-top:16px">${wishlist.map(w=>`<div class="card"><div class="eyebrow">${esc(w.category)}</div><h3>${esc(w.name)}</h3><div class="score">${money(w.price)}</div><p class="muted">${esc(w.reason||'No notes')}</p><div class="actions"><button class="btn small" onclick="buyWish('${w.id}')">Mark purchased</button><button class="btn small danger" onclick="deleteWish('${w.id}')">Remove</button></div></div>`).join('')||'<div class="card empty"><strong>Your wishlist is clear.</strong>Add an item you are considering and evaluate its place in your wardrobe.</div>'}</div><div class="sectionhead"><h2>Wardrobe gap check</h2></div><div class="card">${gapInsights().map(x=>`<div class="recommend">${esc(x)}</div>`).join('')||'Add clothing to explore your wardrobe balance.'}</div>`}

async function buyWish(id){let w=wishlist.find(x=>x.id===id);if(!w)return;if(!confirm('Move this item into your wardrobe? You can add its photo and details afterwards.'))return;await put('items',{...w,id:uid(),wears:0,created:Date.now(),date:new Date().toISOString().slice(0,10)});await del('wishlist',id);await refresh();toast('Added to wardrobe')}
async function deleteWish(id){await del('wishlist',id);await refresh()}
function settings(){setHeader('YOUR SPACE','Settings & privacy','Your wardrobe belongs to you.');$('view').innerHTML=`<div class="grid cols"><div class="card"><h2 style="font:500 23px Georgia,serif">Appearance</h2><p class="muted">Choose how StyleOS looks on this device.</p><button class="btn" onclick="toggleTheme()">Toggle light / dark theme</button><div class="sectionhead"><h2>Data management</h2></div><p class="muted">Export a complete JSON backup including your clothing photographs, outfits, calendar and wishlist.</p><div class="actions"><button class="btn primary" onclick="backup()">Export JSON backup</button><button class="btn" onclick="$('restoreFile').click()">Restore backup</button><input id="restoreFile" type="file" accept=".json,application/json" class="hidden"></div><p style="margin-top:15px"><button class="btn" onclick="exportCSV()">Export wardrobe CSV</button></p><div class="sectionhead"><h2>Storage</h2></div><p class="muted">Data is saved in this browser's local IndexedDB. Clearing browser data may erase it. Export backups regularly.</p></div><div class="card"><h2 style="font:500 23px Georgia,serif">Privacy by design</h2><p>Your wardrobe photographs and information stay in this browser on this device. StyleOS does not send your information to a server.</p><p class="muted">This is a local-first application. It does not sync between devices. Browser storage behaviour can vary, especially when opening local HTML files on mobile.</p><div class="sectionhead"><h2>About StyleOS</h2></div><p><b>STYLEOS</b><br><span class="muted">Personal Style Intelligence · Version 1.0</span></p><p class="muted">Styling scores are transparent rule-based estimates, not AI-generated or scientifically validated fashion ratings.</p><button class="btn danger" onclick="resetAll()">Delete all local data</button></div></div>`;$('restoreFile').onchange=e=>{if(e.target.files[0])restore(e.target.files[0])}}
function toggleTheme(){let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('styleos_theme',t)}
async function backup(){let data={version:1,exported:new Date().toISOString(),items,outfits,logs,wishlist,reviews,calendar};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});download(blob,'styleos-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('Backup exported')}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(file){try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.items)||!Array.isArray(data.outfits))throw Error('Unsupported or invalid backup');if(!confirm('Restore this backup? Existing records with matching IDs will be replaced.'))return;for(let [key,store] of [['items','items'],['outfits','outfits'],['logs','logs'],['wishlist','wishlist'],['reviews','reviews'],['calendar','calendar']]){if(data[key]&&!Array.isArray(data[key]))throw Error('Invalid '+key);for(let x of data[key]||[]){if(!x.id)throw Error('Record missing ID');await put(store,x)}}await refresh();toast('Backup restored')}catch(e){alert('Could not restore backup: '+e.message)}}
function exportCSV(){let rows=[['Name','Category','Colour','Brand','Price INR','Wears','Cost per wear']];items.forEach(i=>rows.push([i.name,i.category,i.color,i.brand,i.price,i.wears,i.wears?Number(i.price||0)/i.wears:'']));let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv'}),'styleos-wardrobe.csv')}
async function resetAll(){if(!confirm('Permanently delete all StyleOS data in this browser? Export a backup first if needed.'))return;for(let s of ['items','outfits','logs','wishlist','reviews','calendar'])for(let x of await all(s))await del(s,x.id);await refresh();toast('Local data deleted')}
async function refresh(){[items,outfits,logs,wishlist,reviews,calendar]=await Promise.all(['items','outfits','logs','wishlist','reviews','calendar'].map(all));render()}
(async()=>{try{db=await openDB();let theme=localStorage.getItem('styleos_theme');if(theme)document.documentElement.dataset.theme=theme;$('themeBtn').onclick=toggleTheme;await refresh()}catch(e){$('view').innerHTML='<div class="card empty"><strong>Storage could not be opened.</strong>Please open this app in a browser that supports IndexedDB.</div>';console.error(e)}})();
</script></body></html>
